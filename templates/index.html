<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover lets the layout extend under the notch; the CSS then
     pads content back out with env(safe-area-inset-*). -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="color-scheme" content="dark">
<meta name="description" content="Search and download music from the Soulseek network, from any device.">
<title>Soulseek Web</title>

<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/static/icons/icon-192.png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SLSK//WEB">

<link rel="preload" href="/static/fonts/space-mono-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/dm-sans.woff2" as="font" type="font/woff2" crossorigin>
<!-- Assets are cached for an hour, so the URLs carry the app version: updating
     changes the URL and the new CSS/JS is picked up on the next load instead of
     whenever the browser happens to revalidate. -->
<link rel="stylesheet" href="/static/css/fonts.css?v={{ version }}">
<link rel="stylesheet" href="/static/css/app.css?v={{ version }}">

<script>window.__BOOT__ = {{ boot|safe }};</script>
<script src="/static/js/i18n.js?v={{ version }}" defer></script>
<script src="/static/js/app.js?v={{ version }}" defer></script>
<script src="/static/js/vendor/alpine.min.js?v={{ version }}" defer></script>
</head>

<body>
<div class="app" :class="{ 'has-player': player.track }" x-data="app()" x-cloak>

  <!-- ══ LOGIN ══════════════════════════════════════════════════════════ -->
  <div class="overlay" x-show="authEnabled && !authed">
    <div class="card">
      <img src="/static/logo-256.png" alt="" class="card-logo">
      <div class="card-sub" x-text="t('loginSub')"></div>
      <div class="field">
        <label class="field-label" for="login-password" x-text="t('passwordLabel')"></label>
        <input id="login-password" class="input" type="password" autocomplete="current-password"
               x-model="loginPassword" @keydown.enter="login()">
      </div>
      <div class="form-error" x-show="loginError" x-text="loginError"></div>
      <button class="btn" @click="login()" :disabled="loggingIn || !loginPassword">
        <span x-text="loggingIn ? t('verifying') : t('loginBtn')"></span>
      </button>
    </div>
  </div>

  <!-- ══ SETUP WIZARD ═══════════════════════════════════════════════════ -->
  <div class="overlay" x-show="authed && setupDone === false">
    <div class="card">
      <img src="/static/logo-256.png" alt="" class="card-logo">
      <div class="card-sub" x-text="t('wizardSub')"></div>

      <!-- Windows standalone: soulseek-web owns its own slskd, so it only needs
           the user's Soulseek account. -->
      <template x-if="localSetup">
        <div>
          <div class="card-title" x-text="t('soulseekAccount')"></div>
          <div class="field">
            <label class="field-label" for="w-user" x-text="t('usernameLabel')"></label>
            <input id="w-user" class="input" type="text" autocomplete="username"
                   x-model="soulseekForm.soulseek_username" @keydown.enter="saveLocalSetup()">
            <div class="field-hint">
              <span x-text="t('noAccountHint')"></span>
              <a href="https://www.slsknet.org/" target="_blank" rel="noopener">slsknet.org</a>
            </div>
          </div>
          <div class="field">
            <label class="field-label" for="w-pass" x-text="t('passwordLabel')"></label>
            <input id="w-pass" class="input" type="password" autocomplete="current-password"
                   x-model="soulseekForm.soulseek_password" @keydown.enter="saveLocalSetup()">
          </div>

          <hr class="divider">
          <div class="card-title" x-text="t('downloadsSection')"></div>
          <div class="field">
            <label class="field-label" for="w-path" x-text="t('downloadFolder')"></label>
            <input id="w-path" class="input" type="text" x-model="soulseekForm.music_path"
                   @keydown.enter="saveLocalSetup()">
            <div class="field-hint" x-text="t('downloadFolderHint')"></div>
          </div>

          <div class="form-error" x-show="setupError" x-text="setupError"></div>
          <button class="btn" @click="saveLocalSetup()"
            :disabled="setupSaving || !soulseekForm.soulseek_username.trim() || !soulseekForm.soulseek_password.trim()">
            <span x-text="setupSaving ? t('connectingLong') : t('startBtn')"></span>
          </button>
        </div>
      </template>

      <!-- Remote: slskd already runs somewhere else. -->
      <template x-if="!localSetup">
        <div>
          <div class="card-title" x-text="t('slskdConnection')"></div>
          <div class="field">
            <label class="field-label" for="w-url" x-text="t('slskdUrlLabel')"></label>
            <input id="w-url" class="input" type="url" placeholder="http://192.168.1.10:5030"
                   x-model="setupForm.slskd_url" @keydown.enter="saveSetup()">
            <div class="field-hint" x-text="t('slskdUrlHint')"></div>
          </div>
          <div class="field">
            <label class="field-label" for="w-key" x-text="t('apiKeyLabel')"></label>
            <input id="w-key" class="input" type="password" autocomplete="off"
                   x-model="setupForm.slskd_api_key" @keydown.enter="saveSetup()">
            <div class="field-hint" x-text="t('apiKeyHint')"></div>
          </div>

          <hr class="divider">
          <div class="card-title" x-text="t('downloadsSection')"></div>
          <div class="field">
            <label class="field-label" for="w-path2" x-text="t('downloadFolder')"></label>
            <input id="w-path2" class="input" type="text" placeholder="/mnt/music/downloads"
                   x-model="setupForm.music_path" @keydown.enter="saveSetup()">
            <div class="field-hint" x-text="t('downloadFolderHint')"></div>
          </div>

          <div class="form-error" x-show="setupError" x-text="setupError"></div>
          <button class="btn" @click="saveSetup()"
            :disabled="setupSaving || !setupForm.slskd_url.trim() || !setupForm.slskd_api_key.trim()">
            <span x-text="setupSaving ? t('verifying') : t('connectSave')"></span>
          </button>
        </div>
      </template>
    </div>
  </div>

  <!-- ══ SIDEBAR (desktop) ══════════════════════════════════════════════ -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="/static/logo-256.png" alt="" width="40" height="40">
      <div class="sidebar-title">SLSK//WEB</div>
      <div class="sidebar-sub" x-text="platform || 'soulseek client'"></div>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item" :class="{ 'is-active': view === 'search' }" @click="go('search')">
        <span class="nav-icon">⌕</span><span x-text="t('navSearch')"></span>
      </button>
      <button class="nav-item" :class="{ 'is-active': view === 'downloads' }" @click="go('downloads')">
        <span class="nav-icon">↓</span><span x-text="t('navDownloads')"></span>
        <span class="nav-badge" x-show="activeDownloads > 0" x-text="activeDownloads"></span>
      </button>
      <button class="nav-item" :class="{ 'is-active': view === 'library' }" @click="go('library')">
        <span class="nav-icon">♪</span><span x-text="t('navLibrary')"></span>
      </button>
      <button class="nav-item" :class="{ 'is-active': view === 'settings' }" @click="go('settings')">
        <span class="nav-icon">⚙</span><span x-text="t('navSettings')"></span>
      </button>
    </nav>
    <div class="sidebar-status">
      <span class="status-dot" :class="{ 'is-connected': connected }"></span>
      <span x-text="connected ? t('connected') : t('disconnected')"></span>
    </div>
  </aside>

  <!-- ══ MAIN ═══════════════════════════════════════════════════════════ -->
  <div class="main">

    <!-- ── SEARCH ─────────────────────────────────────────────────────── -->
    <div class="view" x-show="view === 'search'">
      <div class="topbar">
        <div class="topbar-row">
          <div class="search-wrap">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <label class="visually-hidden" for="q" x-text="t('searchBtn')"></label>
            <input id="q" class="search-input" type="search" enterkeyhint="search"
                   autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                   :placeholder="t('searchPlaceholder')"
                   x-model="query" @keydown.enter="doSearch()">
            <button class="search-clear" x-show="query" @click="clearSearch()"
                    :aria-label="t('clearBtn')">✕</button>
          </div>
          <button class="btn" x-show="!searching" @click="doSearch()" :disabled="!query.trim()"
                  x-text="t('searchBtn')"></button>
          <button class="btn-ghost" x-show="searching" @click="stopSearch()"
                  x-text="t('stopBtn')"></button>
        </div>

        <div class="topbar-controls">
          <div class="segmented">
            <button :class="{ 'is-active': searchMode === 'albums' }" @click="searchMode = 'albums'"
                    x-text="t('albumsMode')"></button>
            <button :class="{ 'is-active': searchMode === 'songs' }" @click="searchMode = 'songs'"
                    x-text="t('songsMode')"></button>
          </div>

          <button class="chip" :class="{ 'is-active': filterExt === '' }" @click="filterExt = ''"
                  x-text="t('allFilter')"></button>
          <button class="chip" :class="{ 'is-active': filterExt === 'FLAC' }" @click="filterExt = 'FLAC'">FLAC</button>
          <button class="chip" :class="{ 'is-active': filterExt === 'MP3' }" @click="filterExt = 'MP3'">MP3</button>

          <select class="chip" x-model="sortBy" @change="setSort($event.target.value)"
                  :aria-label="t('sortLabel')" x-show="searchMode === 'albums' && albums.length > 0">
            <option value="relevance" x-text="t('sortRelevance')"></option>
            <option value="quality" x-text="t('sortQuality')"></option>
            <option value="size" x-text="t('sortSize')"></option>
            <option value="tracks" x-text="t('sortTracks')"></option>
            <option value="speed" x-text="t('sortSpeed')"></option>
          </select>

          <span class="badge is-accent" x-show="advancedSearch" x-text="t('advBadge')"></span>

          <div class="segmented" x-show="searchMode === 'albums' && albums.length > 0">
            <button :class="{ 'is-active': viewMode === 'list' }" @click="setViewMode('list')"
                    :aria-label="t('viewList')">☰</button>
            <button :class="{ 'is-active': viewMode === 'grid' }" @click="setViewMode('grid')"
                    :aria-label="t('viewGrid')">⊞</button>
          </div>
        </div>
      </div>

      <div class="content">
        <div class="error-banner" x-show="searchError">
          <span>⚠</span><span x-text="searchError"></span>
        </div>

        <div class="searching-indicator" x-show="searching">
          <div class="spinner"></div>
          <span x-text="t('searchingNet') + ' · ' + albums.length + ' ' + t('albumsUnit')"></span>
        </div>

        <!-- Idle: recent searches + trending -->
        <div x-show="!searching && !searchId && !searchError">
          <div x-show="recent.length > 0">
            <div class="section-header">
              <span class="section-title" x-text="t('recentTitle')"></span>
              <button class="chip" @click="clearRecent()" x-text="t('clearRecent')"></button>
            </div>
            <div class="recent-row">
              <template x-for="term in recent" :key="term">
                <button class="chip" @click="doSearch(term)" x-text="term"></button>
              </template>
            </div>
          </div>

          <template x-if="trendingLoaded && trending.length > 0">
            <div>
              <div class="section-header">
                <span class="section-title" x-text="t('trendingTitle')"></span>
                <span class="section-sub" x-text="t('trendingSubtitle')"></span>
              </div>
              <div class="trending-grid">
                <template x-for="(album, index) in trending" :key="index">
                  <button class="trending-card" @click="searchTrending(album)"
                          :title="t('trendingSearch') + ': ' + album.artist + ' — ' + album.title">
                    <div class="cover">
                      <div class="cover-fallback">♪</div>
                      <img :src="album.cover_url" alt="" loading="lazy" decoding="async"
                           @error="$el.remove()">
                    </div>
                    <div>
                      <div class="trending-card-title clamp-2" x-text="album.title"></div>
                      <div class="trending-card-artist truncate" x-text="album.artist"></div>
                    </div>
                  </button>
                </template>
              </div>
            </div>
          </template>

          <div class="empty-state" x-show="trendingLoaded && trending.length === 0 && recent.length === 0">
            <div class="empty-state-icon">⌕</div>
            <div class="empty-state-text" x-text="t('emptySearch')"></div>
          </div>
        </div>

        <!-- Few / no results: offer advanced search -->
        <div x-show="showAdvancedHint">
          <div class="empty-state" x-show="visibleAlbums.length === 0">
            <div class="empty-state-icon">⌕</div>
            <div class="empty-state-text" x-text="t('noResultsTitle')"></div>
          </div>
          <div class="suggestion">
            <span class="suggestion-icon">⚡</span>
            <div class="suggestion-body">
              <div class="suggestion-title"
                   x-text="visibleAlbums.length === 0 ? t('noResultsTitle') : t('fewResultsTitle')"></div>
              <div class="suggestion-text"
                   x-text="advancedSearch
                     ? (visibleAlbums.length === 0 ? t('noResultsAlready') : t('fewResultsAlready'))
                     : t('fewResultsText')"></div>
              <button class="btn-download" style="align-self:flex-start" x-show="!advancedSearch"
                      @click="toggleAdvanced()" x-text="t('fewResultsBtn')"></button>
            </div>
          </div>
        </div>

        <!-- Albums -->
        <div x-show="searchMode === 'albums' && visibleAlbums.length > 0">
          <div class="section-header">
            <span class="section-title" x-text="t('albumsFound')"></span>
            <span class="badge" x-text="visibleAlbums.length"></span>
          </div>

          <!-- Grid -->
          <div class="album-grid" x-show="viewMode === 'grid'">
            <template x-for="album in visibleAlbums.slice(0, 200)" :key="album.id">
              <div class="album-card">
                <div class="cover">
                  <div class="cover-fallback">♪</div>
                  <img :src="coverForSearch(album)" alt="" loading="lazy" decoding="async"
                       @error="$el.remove()">
                  <div class="cover-tags">
                    <span class="ext-badge" :class="extClass(album.extension)" x-text="album.extension"></span>
                    <span class="ext-badge" :class="album.free_slots ? 'is-lossless' : ''"
                          x-text="album.free_slots ? t('free') : t('busy')"></span>
                  </div>
                </div>
                <div>
                  <div class="album-card-title clamp-2" :title="album.folder_path" x-text="album.folder_name"></div>
                  <div class="album-card-artist truncate" x-text="album.artist_guess || album.username"></div>
                </div>
                <div class="album-card-meta">
                  <span x-text="album.track_count + ' ' + t('tracksUnit')"></span>
                  <span x-text="formatSize(album.total_size)"></span>
                  <span x-show="album.bitrate" x-text="album.bitrate + 'k'"></span>
                </div>
                <button class="btn-download" :class="{ 'is-queued': queuedFolders.includes(album.folder_path) }"
                        @click="downloadFolder(album)" :disabled="queuedFolders.includes(album.folder_path)"
                        x-text="queuedFolders.includes(album.folder_path) ? t('queued') : t('download')"></button>
              </div>
            </template>
          </div>

          <!-- List -->
          <div class="result-list" x-show="viewMode === 'list'">
            <template x-for="album in visibleAlbums.slice(0, 200)" :key="album.id">
              <div class="result-row" :class="{ 'is-open': expandedAlbum === album.id }">
                <div class="result-main" role="button" tabindex="0"
                     @click="expandedAlbum = expandedAlbum === album.id ? null : album.id"
                     @keydown.enter="expandedAlbum = expandedAlbum === album.id ? null : album.id">
                  <div class="cover cover-sm">
                    <div class="cover-fallback">♪</div>
                    <img :src="coverForSearch(album)" alt="" loading="lazy" decoding="async"
                         @error="$el.remove()">
                  </div>

                  <div class="result-info">
                    <div class="result-title clamp-2" :title="album.folder_path" x-text="album.folder_name"></div>
                    <div class="result-artist truncate" x-text="album.artist_guess || album.username"></div>
                    <div class="result-meta">
                      <span class="ext-badge" :class="extClass(album.extension)" x-text="album.extension"></span>
                      <span x-text="album.track_count + ' ' + t('tracksUnit')"></span>
                      <span x-text="formatSize(album.total_size)"></span>
                      <span x-show="album.bitrate" x-text="album.bitrate + ' kbps'"></span>
                      <span :class="album.free_slots ? 'slot-free' : 'slot-busy'"
                            x-text="album.free_slots ? '● ' + t('free') : '○ ' + t('busy')"></span>
                    </div>
                  </div>

                  <div class="result-detail">
                    <div>
                      <span x-text="t('qualityLabel')"></span>
                      <span x-text="album.bitrate ? album.bitrate + ' kbps' : '—'"></span>
                    </div>
                    <div>
                      <span x-text="t('peerLabel')"></span>
                      <span x-text="formatSpeed(album.upload_speed)"></span>
                    </div>
                  </div>

                  <div class="result-actions">
                    <span style="color:var(--muted);font-size:10px"
                          x-text="expandedAlbum === album.id ? '▲' : '▼'"></span>
                    <button class="btn-download" :class="{ 'is-queued': queuedFolders.includes(album.folder_path) }"
                            @click.stop="downloadFolder(album)"
                            :disabled="queuedFolders.includes(album.folder_path)"
                            x-text="queuedFolders.includes(album.folder_path) ? t('queued') : t('download')"></button>
                  </div>
                </div>

                <div class="track-list" x-show="expandedAlbum === album.id">
                  <template x-for="(file, index) in album.files" :key="index">
                    <div class="track-row">
                      <span class="track-num" x-text="index + 1"></span>
                      <span class="track-name truncate" x-text="baseName(file.filename)"></span>
                      <span class="track-size" x-text="formatSize(file.size)"></span>
                      <button class="icon-btn" @click.stop="downloadSingle(album.username, file)"
                              :aria-label="t('download')">↓</button>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </div>

        <!-- Songs -->
        <div x-show="searchMode === 'songs' && visibleSongs.length > 0">
          <div class="section-header">
            <span class="section-title" x-text="t('songsFound')"></span>
            <span class="badge" x-text="visibleSongs.length"></span>
          </div>
          <div class="result-list">
            <template x-for="(song, index) in visibleSongs.slice(0, 400)" :key="index">
              <div class="result-row">
                <div class="result-main" style="cursor:default">
                  <span class="ext-badge" :class="extClass(song.extension)" x-text="song.extension"></span>
                  <div class="result-info">
                    <div class="result-title truncate" :title="song.filename" x-text="song.displayName"></div>
                    <div class="result-artist truncate" x-text="song.folder_name"></div>
                    <div class="result-meta">
                      <span x-text="formatSize(song.size)"></span>
                      <span x-show="song.bitrate" x-text="song.bitrate + ' kbps'"></span>
                      <span x-text="formatSpeed(song.upload_speed)"></span>
                    </div>
                  </div>
                  <div class="result-actions">
                    <button class="btn-download"
                            @click="downloadSingle(song.username, { filename: song.filename, size: song.size })"
                            x-text="t('download')"></button>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </div>
      </div>
    </div>

    <!-- ── DOWNLOADS ──────────────────────────────────────────────────── -->
    <div class="view" x-show="view === 'downloads'">
      <div class="topbar">
        <div class="topbar-row">
          <span class="topbar-title" x-text="t('downloadsTitle')"></span>
          <span class="badge" x-text="downloads.length"></span>
          <span style="flex:1"></span>
          <button class="btn-ghost btn-sm" @click="clearCompleted()" x-show="downloads.length > 0"
                  x-text="t('clearCompleted')"></button>
          <button class="btn-ghost btn-sm" @click="loadDownloads()" x-text="t('refresh')"></button>
        </div>
      </div>

      <div class="content">
        <div class="error-banner" x-show="downloadsError">
          <span>⚠</span><span x-text="downloadsError"></span>
        </div>

        <div class="empty-state" x-show="!downloadsError && downloads.length === 0">
          <div class="empty-state-icon">↓</div>
          <div class="empty-state-text" x-text="t('noDownloads')"></div>
          <div class="empty-state-text" style="font-size:12px" x-text="t('noDownloadsHint')"></div>
        </div>

        <template x-for="(group, index) in downloads" :key="group.id">
          <div class="dl-card">
            <div class="dl-head" role="button" tabindex="0"
                 @click="expandedGroup = expandedGroup === index ? null : index"
                 @keydown.enter="expandedGroup = expandedGroup === index ? null : index">
              <div class="cover cover-md">
                <div class="cover-fallback">♪</div>
                <img :src="coverForFolder(group.folder_name)" alt="" loading="lazy" decoding="async"
                     @error="$el.remove()">
              </div>

              <div class="dl-info">
                <div class="dl-name clamp-2" :title="group.folder_name" x-text="group.folder_name"></div>
                <div class="dl-meta">
                  <span x-text="group.username"></span>
                  <span x-text="group.files.length + ' ' + (group.files.length === 1 ? t('fileUnit') : t('filesUnit'))"></span>
                  <span x-show="group.total_size > 0" x-text="formatSize(group.total_size)"></span>
                  <span x-show="group.speed > 0" x-text="formatSpeed(group.speed)"></span>
                  <span x-show="group.eta" x-text="formatEta(group.eta) + ' ' + t('etaLabel')"></span>
                </div>
                <div class="progress">
                  <div class="progress-fill"
                       :class="{
                         'is-complete': group.state === 'Completed',
                         'is-errored': group.state === 'Errored',
                         'is-active': group.state === 'InProgress'
                       }"
                       :style="'width:' + (group.progress || 0) + '%'"></div>
                </div>
              </div>

              <div class="dl-actions" @click.stop>
                <span class="state-badge" :class="stateClass(group.state)" x-text="stateLabel(group.state)"></span>
                <button class="icon-btn is-danger" @click="deleteFolder(group)"
                        :aria-label="t('delete')">✕</button>
              </div>
            </div>

            <div class="dl-tracks" x-show="expandedGroup === index">
              <template x-for="(file, fileIndex) in group.files" :key="fileIndex">
                <div class="dl-track">
                  <span class="truncate" :title="file.filename" x-text="file.filename"></span>
                  <span style="display:flex;align-items:center;gap:6px">
                    <span class="state-badge" :class="stateClass(file.state)"
                          x-text="file.percent > 0 && file.percent < 100
                            ? file.percent.toFixed(0) + '%'
                            : stateLabel(file.state)"></span>
                    <button class="icon-btn is-danger" x-show="file.file_id && !file.state.includes('Completed')"
                            @click="cancelFile(group, file)" :aria-label="t('cancelTransfer')">✕</button>
                  </span>
                  <div class="dl-track-bar progress" x-show="file.percent > 0 && file.percent < 100">
                    <div class="progress-fill is-active" :style="'width:' + file.percent + '%'"></div>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
    </div>

    <!-- ── LIBRARY ────────────────────────────────────────────────────── -->
    <div class="view" x-show="view === 'library'">
      <div class="topbar">
        <div class="topbar-row">
          <button class="btn-ghost btn-sm" x-show="openAlbumEntry" @click="closeAlbum()"
                  x-text="'← ' + t('backToLibrary')"></button>
          <span class="topbar-title" x-show="!openAlbumEntry" x-text="t('libraryTitle')"></span>
          <span class="topbar-title truncate" x-show="openAlbumEntry"
                x-text="openAlbumEntry ? openAlbumEntry.album : ''"></span>
          <span class="badge" x-show="!openAlbumEntry" x-text="library.length"></span>
          <span style="flex:1"></span>
          <button class="btn-ghost btn-sm" @click="loadLibrary(true)" x-text="t('refresh')"></button>
        </div>
      </div>

      <div class="content">
        <div class="error-banner" x-show="libraryError">
          <span>⚠</span><span x-text="libraryError"></span>
        </div>

        <div class="searching-indicator" x-show="libraryLoading">
          <div class="spinner"></div><span x-text="t('libraryScanning')"></span>
        </div>

        <!-- Album grid -->
        <div x-show="!openAlbumEntry && !libraryLoading">
          <div class="empty-state" x-show="library.length === 0 && !libraryError">
            <div class="empty-state-icon">♪</div>
            <div class="empty-state-text" x-text="t('noLibrary')"></div>
            <div class="empty-state-text" style="font-size:12px" x-text="t('noLibraryHint')"></div>
          </div>

          <div class="library-grid">
            <template x-for="entry in library" :key="entry.path">
              <button class="library-card" @click="openAlbum(entry)">
                <div class="cover">
                  <div class="cover-fallback">♪</div>
                  <img :src="coverForLibrary(entry)" alt="" loading="lazy" decoding="async"
                       @error="$el.remove()">
                </div>
                <div>
                  <div class="library-card-title clamp-2" x-text="entry.album"></div>
                  <div class="library-card-artist truncate"
                       x-text="entry.artist || (entry.track_count + ' ' + t('tracksUnit'))"></div>
                </div>
              </button>
            </template>
          </div>
        </div>

        <!-- Album detail -->
        <div x-show="openAlbumEntry">
          <div class="section-header">
            <button class="btn btn-sm" @click="albumTracks.length && playTrack(albumTracks[0], albumTracks)"
                    :disabled="!albumTracks.length" x-text="'▶ ' + t('playAlbum')"></button>
            <span class="section-sub" x-text="openAlbumEntry
              ? (openAlbumEntry.artist ? openAlbumEntry.artist + ' · ' : '') + formatSize(openAlbumEntry.total_size)
              : ''"></span>
          </div>

          <div class="searching-indicator" x-show="tracksLoading">
            <div class="spinner"></div>
          </div>

          <div class="result-row">
            <template x-for="track in albumTracks" :key="track.path">
              <div class="lib-track" :class="{ 'is-playing': isPlaying(track) }">
                <span class="track-num" x-text="track.track_no"></span>
                <span class="track-name truncate" :title="track.filename" x-text="track.title"></span>
                <span class="track-size" x-show="track.duration" x-text="formatTime(track.duration)"></span>
                <button class="icon-btn" @click="playTrack(track, albumTracks)" :aria-label="t('play')"
                        x-text="isPlaying(track) && player.playing ? '❚❚' : '▶'"></button>
                <a class="icon-btn" :href="'/api/stream/download?path=' + encodeURIComponent(track.path)"
                   :download="track.filename" :aria-label="t('saveToDevice')">⤓</a>
              </div>
            </template>
          </div>
        </div>
      </div>
    </div>

    <!-- ── SETTINGS ───────────────────────────────────────────────────── -->
    <div class="view" x-show="view === 'settings'">
      <div class="topbar">
        <div class="topbar-row">
          <span class="topbar-title" x-text="t('settingsTitle')"></span>
          <span class="badge" x-show="platform" x-text="platform"></span>
        </div>
      </div>

      <div class="content" style="max-width:560px">

        <div class="settings-group">
          <div class="section-header"><span class="section-title" x-text="t('soulseekAccount')"></span></div>
          <div class="field">
            <label class="field-label" for="s-user" x-text="t('usernameLabel')"></label>
            <input id="s-user" class="input" type="text" autocomplete="username"
                   x-model="settingsForm.soulseek_username">
          </div>
          <div class="field">
            <label class="field-label" for="s-pass" x-text="t('passwordLabel')"></label>
            <input id="s-pass" class="input" type="password" autocomplete="current-password"
                   x-model="settingsForm.soulseek_password">
            <div class="field-hint" x-show="!localSetup" x-text="t('passwordHint')"></div>
          </div>
        </div>

        <div class="settings-group" x-show="!localSetup">
          <div class="section-header"><span class="section-title" x-text="t('slskdConnection')"></span></div>
          <div class="field">
            <label class="field-label" for="s-url" x-text="t('slskdUrlLabel')"></label>
            <input id="s-url" class="input" type="text" x-model="settingsForm.slskd_url">
          </div>
          <div class="field">
            <label class="field-label" for="s-key" x-text="t('apiKeyLabel')"></label>
            <input id="s-key" class="input" type="password" autocomplete="off"
                   x-model="settingsForm.slskd_api_key">
          </div>
          <button class="btn-ghost btn-sm" @click="testConnection()" :disabled="testing"
                  x-text="testing ? t('testing') : t('testConnection')"></button>
          <div class="field-hint" x-show="testResult" x-text="testResult"></div>
        </div>

        <div class="settings-group">
          <div class="section-header"><span class="section-title" x-text="t('downloadsSection')"></span></div>
          <div class="field">
            <label class="field-label" for="s-path" x-text="t('downloadFolder')"></label>
            <input id="s-path" class="input" type="text" x-model="settingsForm.music_path">
            <div class="field-hint" x-text="t('downloadFolderHint')"></div>
          </div>

          <div class="form-error" x-show="settingsError" x-text="settingsError"></div>
          <div class="form-ok" x-show="settingsOk" x-text="'✓ ' + t('changesSaved')"></div>
          <button class="btn" @click="saveSettings()" :disabled="settingsSaving"
                  x-text="settingsSaving ? (localSetup ? t('connectingLong') : t('verifying')) : t('saveChanges')"></button>
        </div>

        <div class="settings-group">
          <div class="section-header"><span class="section-title" x-text="t('searchSection')"></span></div>
          <div class="field-row">
            <div>
              <span class="field-label" x-text="t('advSearchLabel')"></span>
              <div class="field-hint" x-text="t('advSearchHint')"></div>
            </div>
            <button class="switch" :class="{ 'is-on': advancedSearch }"
                    @click="advancedSearch = !advancedSearch; savePreferences()"
                    role="switch" :aria-checked="advancedSearch" :aria-label="t('advSearchLabel')"></button>
          </div>
        </div>

        <div class="settings-group">
          <div class="section-header"><span class="section-title" x-text="t('securitySection')"></span></div>
          <div class="field">
            <div class="field-hint" style="margin-top:0"
                 x-text="authManagedByEnv ? t('appPasswordEnvHint') : t('appPasswordHint')"></div>
          </div>
          <template x-if="!authManagedByEnv">
            <div>
              <div class="field">
                <label class="field-label" for="s-appass" x-text="t('newPassword')"></label>
                <input id="s-appass" class="input" type="password" autocomplete="new-password"
                       x-model="newPassword" :placeholder="authEnabled ? '••••••' : ''">
              </div>
              <div style="display:flex;gap:8px;flex-wrap:wrap">
                <button class="btn btn-sm" @click="savePassword()"
                        :disabled="passwordSaving || !newPassword.trim()" x-text="t('setPassword')"></button>
                <button class="btn-ghost btn-sm" x-show="authEnabled"
                        @click="newPassword = ''; savePassword()" :disabled="passwordSaving"
                        x-text="t('removePassword')"></button>
                <button class="btn-ghost btn-sm" x-show="authEnabled" @click="logout()"
                        x-text="t('logout')"></button>
              </div>
            </div>
          </template>
        </div>

        <div class="settings-group" x-show="installPrompt">
          <div class="section-header"><span class="section-title" x-text="t('installSection')"></span></div>
          <div class="field-hint" style="margin-bottom:12px" x-text="t('installHint')"></div>
          <button class="btn btn-sm" @click="promptInstall()" x-text="t('installBtn')"></button>
        </div>

        <div class="settings-group">
          <div class="section-header"><span class="section-title" x-text="t('langSection')"></span></div>
          <div style="display:flex;gap:8px">
            <button class="chip" :class="{ 'is-active': lang === 'es' }" @click="setLang('es')">ES</button>
            <button class="chip" :class="{ 'is-active': lang === 'en' }" @click="setLang('en')">EN</button>
          </div>
        </div>

        <div class="settings-group">
          <div class="section-header"><span class="section-title" x-text="t('updateSection')"></span></div>
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
            <span class="field-label" style="margin:0" x-text="t('currentVersion')"></span>
            <span class="badge is-accent" x-text="appVersion || '—'"></span>
            <span class="badge" x-show="appCommit" x-text="appCommit"></span>
          </div>
          <div class="code-block" x-show="updateLog" x-text="updateLog" style="margin-bottom:12px"></div>
          <div class="form-error" x-show="updateError" x-text="updateError"></div>
          <div class="form-ok" style="color:#fc6" x-show="updateNeedsRestart" x-text="t('updateDownloaded')"></div>
          <button class="btn-ghost" @click="triggerUpdate()" :disabled="updating"
                  x-text="updating ? t('updatingBtn') : (alreadyLatest ? t('upToDate') : t('updateBtn'))"></button>
        </div>

      </div>
    </div>

  </div><!-- /main -->

  <!-- ══ MINI PLAYER ════════════════════════════════════════════════════ -->
  <div class="player" x-show="player.track">
    <div class="player-seek" @click="seek($event)">
      <div class="player-seek-fill"
           :style="'width:' + (player.duration ? (player.position / player.duration * 100) : 0) + '%'"></div>
    </div>

    <button class="player-play" @click="togglePlay()"
            :aria-label="player.playing ? t('pause') : t('play')"
            x-text="player.playing ? '❚❚' : '▶'"></button>

    <div class="player-info">
      <div class="player-title truncate" x-text="player.track ? (player.track.title || player.track.filename) : ''"></div>
      <div class="player-artist truncate"
           x-text="formatTime(player.position) + ' / ' + formatTime(player.duration)"></div>
    </div>

    <div class="player-actions">
      <button class="icon-btn" @click="playPrevious()" :aria-label="t('previousTrack')">⏮</button>
      <button class="icon-btn" @click="playNext()" :aria-label="t('nextTrack')">⏭</button>
      <button class="icon-btn" @click="closePlayer()" :aria-label="t('closePlayer')">✕</button>
    </div>
  </div>

  <!-- ══ BOTTOM NAV (phone) ═════════════════════════════════════════════ -->
  <nav class="bottom-nav">
    <button class="bottom-nav-item" :class="{ 'is-active': view === 'search' }" @click="go('search')">
      <span class="nav-icon">⌕</span><span x-text="t('navSearch')"></span>
    </button>
    <button class="bottom-nav-item" :class="{ 'is-active': view === 'downloads' }" @click="go('downloads')">
      <span class="nav-icon">↓</span><span x-text="t('navDownloads')"></span>
      <span class="nav-badge" x-show="activeDownloads > 0" x-text="activeDownloads"></span>
    </button>
    <button class="bottom-nav-item" :class="{ 'is-active': view === 'library' }" @click="go('library')">
      <span class="nav-icon">♪</span><span x-text="t('navLibrary')"></span>
    </button>
    <button class="bottom-nav-item" :class="{ 'is-active': view === 'settings' }" @click="go('settings')">
      <span class="nav-icon">⚙</span><span x-text="t('navSettings')"></span>
    </button>
  </nav>

  <!-- ══ CONFIRM DIALOG ═════════════════════════════════════════════════ -->
  <div class="overlay is-dim" x-show="confirmState.open" @keydown.escape.window="resolveConfirm(false)">
    <div class="modal">
      <div class="modal-title" x-text="confirmState.title"></div>
      <div class="modal-text" x-text="confirmState.body"></div>
      <div class="modal-actions">
        <button class="btn-ghost" @click="resolveConfirm(false)" x-text="t('cancelBtn')"></button>
        <button class="btn-danger" @click="resolveConfirm(true)" x-text="confirmState.label"></button>
      </div>
    </div>
  </div>

  <!-- ══ TOASTS ═════════════════════════════════════════════════════════ -->
  <div class="toast-container">
    <template x-for="item in toasts" :key="item.id">
      <div class="toast" :class="{ 'is-error': item.isError }" x-text="item.message"></div>
    </template>
  </div>

</div><!-- /app -->
</body>
</html>
